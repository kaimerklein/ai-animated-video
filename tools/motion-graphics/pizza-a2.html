<title>Flour to Fire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 16:9 stage, letterboxed and centred; a quiet review deck under it (transport, scrubber, shot chips). Single dark look by design: palette "wood-fired night". */
:root {
  --char: #0c0807;
  --char-2: #18100d;
  --ember: #ff8a3d;
  --plum: #4a1d3a;
  --cream: #fff3e0;
  --ash: #a28e80;
  --line: rgba(255, 236, 220, 0.16);
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--char); color: var(--cream); font-family: var(--f-ui);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
}
.stage { position: relative; background: #000; border-radius: 10px; overflow: hidden; container-type: inline-size; max-width: 100%; flex: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ov { position: absolute; inset: 0; pointer-events: none; }
#flash { background: radial-gradient(ellipse at 50% 55%, #fff7e8 0%, #ffb15e 38%, rgba(255,110,40,0) 80%); opacity: 0; mix-blend-mode: screen; }
#scrim { background: radial-gradient(ellipse at 50% 50%, rgba(8,4,3,0.35), rgba(8,4,3,0.85)); opacity: 0; }
#title { display: grid; place-content: center; justify-items: center; text-align: center; gap: 1.4cqw; opacity: 0; }
#title .eyebrow { font-weight: 700; font-size: 1.35cqw; letter-spacing: 0.32em; color: var(--ember); text-transform: uppercase; }
#title h1 { margin: 0; font-weight: 800; font-size: 7.2cqw; letter-spacing: -0.035em; line-height: 0.95; color: #fff8ee; text-wrap: balance; }
#title .pill { margin-top: 1.2cqw; padding: 0.9cqw 2.2cqw; border-radius: 999px; font-weight: 600; font-size: 1.5cqw; color: #fff4e6;
  background: rgba(255, 236, 220, 0.10); border: 1px solid rgba(255, 200, 160, 0.55); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 0 3cqw rgba(255,138,61,0.25); }
#capShade { background: linear-gradient(to top, rgba(8,4,3,0.62) 0%, rgba(8,4,3,0.25) 22%, rgba(8,4,3,0) 38%); }
#cap { display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6.2cqw; }
#capLine { max-width: 70cqw; text-align: center; font-weight: 600; font-size: 2.35cqw; line-height: 1.28; letter-spacing: -0.01em; text-wrap: balance;
  color: #fff3e0; text-shadow: 0 0.15cqw 1.2cqw rgba(0,0,0,0.65); will-change: transform, opacity, filter; }
#capLine .w { display: inline-block; white-space: pre; will-change: transform, opacity, color; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ash); }

.deck { width: 100%; max-width: 1280px; display: grid; gap: 10px; flex: none; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn { font: 600 13px/1 var(--f-ui); letter-spacing: 0.04em; color: var(--cream); background: var(--char-2); border: 1px solid var(--line);
  padding: 9px 14px; border-radius: 6px; cursor: pointer; }
.btn:hover { border-color: rgba(255, 138, 61, 0.6); }
.btn:focus-visible, #scrub:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
#scrub { flex: 1 1 200px; min-width: 0; accent-color: var(--ember); }
.time { font: 500 12px/1 var(--f-mono); color: var(--ash); font-variant-numeric: tabular-nums; min-width: 12ch; }
.time b { color: var(--cream); font-weight: 500; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 500 12px/1 var(--f-mono); color: var(--ash); background: transparent; border: 1px solid var(--line); padding: 7px 10px; border-radius: 999px; cursor: pointer; }
.chip[aria-current="true"] { color: var(--char); background: var(--ember); border-color: var(--ember); }
.chip:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.capture body, body.capture { padding: 0; gap: 0; }
body.capture .deck { display: none; }
body.capture .stage { border-radius: 0; }
</style>

<div class="stage" id="stage">
  <canvas id="gl" aria-label="Animated 3D motion graphic: the process of making a pizza, from flour to wood-fired oven, along a glowing path"></canvas>
  <div class="ov" id="flash"></div>
  <div class="ov" id="capShade"></div>
  <div class="ov" id="cap" aria-live="off"><div id="capLine"></div></div>
  <div class="ov" id="scrim"></div>
  <div class="ov" id="title">
    <div class="eyebrow">Six steps · one dough</div>
    <h1>From flour<br>to fire</h1>
    <div class="pill">Built with Claude + three.js</div>
  </div>
  <div class="fallback" id="fallback" hidden>WebGL is not available in this browser, so the animation cannot render.</div>
</div>

<div class="deck">
  <div class="row">
    <button class="btn" id="play" type="button">Pause</button>
    <input id="scrub" type="range" min="0" max="102.4" step="0.0166667" value="0" aria-label="Timeline position in seconds">
    <span class="time" id="time"><b>000.00</b> / 102.40 s</span>
    <button class="btn" id="twos" type="button" aria-pressed="false">On twos: off</button>
  </div>
  <div class="chips" id="chips" aria-label="Jump to a shot"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
  // ================= config =================
  // Choreography is authored in "story seconds" (0–32); SLOW stretches it to real seconds.
  // Ambient motion (fire, embers, orbs, grain, camera breathing) runs on real time so it never looks slow-motion.
  const SLOW = 3.2, STORY = 32, DURATION = STORY * SLOW, FPS = 60;
  const QS = new URLSearchParams(location.search);
  const CAPTURE = QS.has('capture');
  let TWOS = QS.has('twos');

  // Single source of truth for every number on screen and in the narration (fact grounding).
  const RECIPE = { flour_g: 500, water_g: 325, salt_g: 15, yeast_g: 2, hydration_pct: 65, knead_min: 10, proof_h: 24, proof_c: 4,
    diameter_cm: 30, sauce_g: 80, mozz_g: 100, basil_leaves: 6, oil_tbsp: 1, oven_c: 450, bake_s: 90 };
  const R = RECIPE;

  // Narration in timing.json shape (real seconds). Word times are estimated until a TTS track is aligned.
  const NARRATION = [
    [0.6, 5.6, 'Every great pizza starts with flour, water and time.'],
    [7.6, 12.2, `Start with ${R.flour_g} grams of tipo 00 flour and make a well.`],
    [12.8, 17.4, `Pour in ${R.water_g} grams of water, then the salt and a little yeast.`],
    [17.9, 21.9, `That is ${R.hydration_pct} percent hydration: a soft, airy dough.`],
    [23.8, 28.4, `Knead by hand. Fold, push, turn, for about ${R.knead_min} minutes.`],
    [29.0, 33.2, 'The rough mass turns smooth and elastic.'],
    [33.8, 37.9, 'Stretch a thin piece. If light shines through, the gluten is ready.'],
    [39.8, 44.6, `Now let it rest. A cold proof at ${R.proof_c} degrees for ${R.proof_h} hours`],
    [45.0, 50.6, 'doubles the volume and builds deep flavour.'],
    [52.6, 57.8, 'Press from the centre outwards, by hand. No rolling pin.'],
    [58.3, 63.6, `Open it to ${R.diameter_cm} centimetres and leave a thick rim.`],
    [65.4, 70.2, `Spread ${R.sauce_g} grams of San Marzano tomatoes in a spiral.`],
    [70.6, 76.3, `Add ${R.mozz_g} grams of fior di latte, fresh basil and olive oil.`],
    [78.2, 83.4, `Slide it into a wood-fired oven at ${R.oven_c} degrees.`],
    [83.8, 88.6, `${R.bake_s} seconds later, the crust is blistered and charred.`],
    [90.6, 95.4, 'Six steps. One dough. From flour to fire.']
  ].map(([start, end, text]) => {
    const words = text.split(' '); const wt = words.map(w => w.length + 2 + (/[.,:]$/.test(w) ? 5 : 0));
    const total = wt.reduce((a, b) => a + b, 0), span = (end - start) - 0.35; let acc = 0;
    return { start, end, text, words: words.map((w, i) => { const s = start + span * acc / total; acc += wt[i]; return { w, start: s, end: start + span * acc / total }; }) };
  });
  if (CAPTURE) document.body.classList.add('capture');
  const SHOTS = [
    { name: 'Ignite', t0: 0, t1: 2 },
    { name: '01 Mix', t0: 2, t1: 7 },
    { name: '02 Knead', t0: 7, t1: 12 },
    { name: '03 Proof', t0: 12, t1: 16 },
    { name: '04 Stretch', t0: 16, t1: 20 },
    { name: '05 Top', t0: 20, t1: 24 },
    { name: '06 Bake', t0: 24, t1: 28 },
    { name: 'Reveal', t0: 28, t1: 32 }
  ];
  const WHIP = 0.5; // story seconds ≈ 1.6 s real: the whips stay snappy while the drifts slow down

  // ================= helpers (all pure) =================
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, x) => a + (b - a) * x;
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const eout = x => 1 - Math.pow(1 - x, 3);
  const ein = x => x * x * x;
  const expoIO = x => x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const L = h => new THREE.Color(h).convertSRGBToLinear();

  // ================= renderer =================
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('gl');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE }); }
  catch (e) { document.getElementById('fallback').hidden = false; return; }
  renderer.outputEncoding = THREE.LinearEncoding;
  renderer.toneMapping = THREE.NoToneMapping;

  const scene = new THREE.Scene();
  const FOGC = L('#140d0b');
  scene.fog = new THREE.FogExp2(FOGC, 0.012);
  const camera = new THREE.PerspectiveCamera(38, 16 / 9, 0.1, 1200);

  // ================= textures =================
  function radialTex(stops) {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  const glowTex = radialTex([[0, 'rgba(255,255,255,1)'], [0.22, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0)']]);
  const dotTex = radialTex([[0, 'rgba(255,255,255,1)'], [0.5, 'rgba(255,255,255,0.6)'], [1, 'rgba(255,255,255,0)']]);

  // ================= world: dome of soft blobs =================
  const domeMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uHeat: { value: 0 }, uFlash: { value: 0 } },
    vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `
      uniform float uHeat, uFlash; varying vec3 vD;
      float blob(vec3 d, vec3 c, float k){ return pow(max(dot(d, normalize(c)), 0.), k); }
      void main(){
        vec3 d = normalize(vD);
        vec3 col = vec3(0.010, 0.006, 0.005);
        col += vec3(0.085, 0.014, 0.050) * blob(d, vec3(-0.6, 0.45, -0.5), 2.5);
        col += vec3(0.42, 0.075, 0.010) * blob(d, vec3(0.75, -0.05, -0.6), 3.5) * (0.35 + uHeat * 1.5);
        col += vec3(0.18, 0.035, 0.008) * blob(d, vec3(0.2, -0.55, 0.75), 3.0) * (0.5 + uHeat);
        col += vec3(0.06, 0.012, 0.035) * blob(d, vec3(-0.4, -0.2, 0.9), 2.0);
        col *= 1.0 - 0.4 * smoothstep(0.35, 0.95, d.y);
        col += vec3(1.0, 0.5, 0.2) * uFlash * 0.8;
        gl_FragColor = vec4(col, 1.);
      }`
  });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(600, 48, 24), domeMat);
  dome.renderOrder = -10; scene.add(dome);

  // ================= lights =================
  scene.add(new THREE.HemisphereLight(L('#7a4060'), L('#1a0d08'), 0.45));
  const key = new THREE.DirectionalLight(L('#ffd9b8'), 1.25); key.position.set(-6, 10, 8); scene.add(key);
  const rim = new THREE.DirectionalLight(L('#c0507e'), 1.0); rim.position.set(8, 4, -10); scene.add(rim);
  const headLight = new THREE.PointLight(L('#ff8a3d'), 3.0, 10, 2); scene.add(headLight);
  const ovenLight = new THREE.PointLight(L('#ff7a2a'), 0, 22, 2); scene.add(ovenLight);

  // ================= stations + path =================
  const C = [V(0, 0, 0), V(13, 1.5, -9), V(25, -0.5, -3), V(36, 2.5, -13), V(47, 0, -5), V(59, 1.5, -15), V(70, 0, -6)];
  const PATH_OFF = V(-2.6, 0.25, 2.0);
  const pts = [V(-14, 3, 16)]; const stIdx = [];
  C.forEach((c, i) => {
    stIdx.push(pts.length); pts.push(c.clone().add(PATH_OFF));
    if (i < C.length - 1) pts.push(c.clone().lerp(C[i + 1], 0.5).add(V(0, i % 2 ? -2.2 : 2.6, 3.2)));
  });
  pts.push(C[6].clone().add(V(6, 1.2, 4)));
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  const LEN = curve.getLengths(2000);
  const U = stIdx.map(k => LEN[Math.round(k / (pts.length - 1) * 2000)] / LEN[2000]);

  const tubeMat = new THREE.ShaderMaterial({
    uniforms: { uP: { value: 0 }, uCol: { value: new THREE.Vector3(2.4, 0.75, 0.18) } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform float uP; uniform vec3 uCol; varying vec2 vUv;
      void main(){ float d = uP - vUv.x; if (d < 0.) discard;
        float head = exp(-d * 90.); vec3 c = uCol * (0.7 + head * 7.0) * (0.55 + 0.45 * exp(-d * 4.0));
        gl_FragColor = vec4(c, 1.); }`
  });
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 1400, 0.05, 10, false), tubeMat));
  const head = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: new THREE.Color(5, 2.2, 0.8), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  head.scale.set(1.6, 1.6, 1); scene.add(head);

  function headU(t) {
    if (t < SHOTS[1].t0) return lerp(0, U[0], eio(seg(t, 0.15, 2.0)));
    let u = U[0];
    for (let s = 2; s <= 7; s++) {
      const t0 = SHOTS[s].t0;
      if (t >= t0) u = lerp(U[s - 2], U[s - 1], expoIO(seg(t, t0, t0 + WHIP)));
    }
    if (t > 29.4) u = lerp(U[6], 1, eio(seg(t, 29.4, 31.2)));
    return u;
  }

  // ================= glass material (fake, cheap, deterministic) =================
  function glassMat(tint = L('#ffe6d2'), double = false) {
    return new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: double ? THREE.DoubleSide : THREE.FrontSide,
      uniforms: { uTint: { value: tint }, uOp: { value: 1 }, uWarm: { value: new THREE.Vector3(1.2, 0.45, 0.12) }, uHeat: { value: 0 } },
      vertexShader: `varying vec3 vN; varying vec3 vV;
        void main(){ vec4 w = modelMatrix*vec4(position,1.); vN = normalize(mat3(modelMatrix)*normal); vV = normalize(cameraPosition - w.xyz); gl_Position = projectionMatrix*viewMatrix*w; }`,
      fragmentShader: `uniform vec3 uTint, uWarm; uniform float uOp, uHeat; varying vec3 vN; varying vec3 vV;
        void main(){
          vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n; vec3 v = normalize(vV);
          float f = pow(1. - abs(dot(n, v)), 3.);
          vec3 l1 = normalize(vec3(-0.5, 0.8, 0.6)); vec3 l2 = normalize(vec3(0.7, 0.1, -0.7));
          float s1 = pow(max(dot(reflect(-v, n), l1), 0.), 60.); float s2 = pow(max(dot(reflect(-v, n), l2), 0.), 18.);
          vec3 c = uTint * 0.06 + uTint * f * 1.1 + vec3(1.6) * s1 + uWarm * (s2 * (0.6 + uHeat) + f * 0.5);
          float a = (0.07 + f * 0.7 + s1 + s2 * 0.4) * uOp;
          gl_FragColor = vec4(c, clamp(a, 0., 1.));
        }`
    });
  }
  const glassAll = [];
  const mkGlass = (...a) => { const m = glassMat(...a); glassAll.push(m); return m; };

  // ================= dough: parametric sphere ↔ pizza-base morph =================
  function makeDough(NS = 40, NA = 60) {
    const g = new THREE.BufferGeometry(); const n = (NS + 1) * (NA + 1);
    const sa = new Float32Array(n * 2); let k = 0;
    for (let i = 0; i <= NS; i++) for (let j = 0; j <= NA; j++) { sa[k * 2] = i / NS; sa[k * 2 + 1] = j / NA * Math.PI * 2; k++; }
    const idx = [];
    for (let i = 0; i < NS; i++) for (let j = 0; j < NA; j++) { const a = i * (NA + 1) + j, b = a + NA + 1; idx.push(a, a + 1, b, b, a + 1, b + 1); }
    g.setIndex(idx); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    g.userData = { sa, key: '' }; return g;
  }
  function baseProfile(s, Rd) {
    const rr = 0.2, Rc = Rd - rr, top = 0.1;
    if (s < 0.4) return [(s / 0.4) * (Rc - rr), top];
    if (s < 0.75) { const th = Math.PI - (s - 0.4) / 0.35 * 1.5 * Math.PI; return [Rc + rr * Math.cos(th), rr + rr * Math.sin(th)]; }
    return [Rc * (1 - (s - 0.75) / 0.25), 0];
  }
  function updateDough(g, o) {
    const { m = 0, R = 1, Rd = 2, rough = 0, sq = 0, seed = 1 } = o;
    const keyStr = [m, R, rough, sq].map(x => x.toFixed(4)).join('|');
    if (g.userData.key === keyStr) return; g.userData.key = keyStr;
    const p = g.attributes.position.array, sa = g.userData.sa, n = sa.length / 2;
    for (let k = 0; k < n; k++) {
      const s = sa[k * 2], a = sa[k * 2 + 1], ca = Math.cos(a), sn = Math.sin(a), v = s * Math.PI;
      let x = R * Math.sin(v) * ca, y = R + R * Math.cos(v), z = R * Math.sin(v) * sn;
      if (m > 0) { const [rho, py] = baseProfile(s, Rd); x = lerp(x, rho * ca, m); y = lerp(y, py, m); z = lerp(z, rho * sn, m); }
      if (rough > 0) {
        const nz = Math.sin(x * 3.7 + seed) * Math.sin(y * 4.1 + 1.7) * Math.sin(z * 3.3 + seed * 2) + 0.5 * Math.sin(x * 8.3 + 2.1) * Math.sin(y * 7.9 + seed) * Math.sin(z * 9.1);
        const cy = y - R * (1 - m); const l = Math.hypot(x, cy, z) || 1; const d = rough * nz;
        x += x / l * d; y += cy / l * d; z += z / l * d;
      }
      p[k * 3] = x * (1 + sq * 0.55); p[k * 3 + 1] = y * (1 - sq); p[k * 3 + 2] = z * (1 + sq * 0.55);
    }
    g.attributes.position.needsUpdate = true; g.computeVertexNormals(); g.computeBoundingSphere();
  }
  const doughMat = new THREE.MeshStandardMaterial({ color: L('#f0dcb8'), roughness: 0.62, metalness: 0, side: THREE.DoubleSide, emissive: L('#2a1206'), emissiveIntensity: 0.6 });

  // ================= station 1: flour, well, water =================
  const flourN = 2600, flourPos = new Float32Array(flourN * 3);
  const flourGeo = new THREE.BufferGeometry(); flourGeo.setAttribute('position', new THREE.BufferAttribute(flourPos, 3));
  const flour = new THREE.Points(flourGeo, new THREE.PointsMaterial({ map: dotTex, size: 0.075, color: L('#cbbba4'), transparent: true, depthWrite: false }));
  flour.position.copy(C[0]); scene.add(flour);
  const dustN = 380, dustPos = new Float32Array(dustN * 3);
  const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ map: dotTex, size: 0.05, color: new THREE.Color(1.6, 0.9, 0.5), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  dust.position.copy(C[0]); scene.add(dust);
  const pool = new THREE.Mesh(new THREE.CircleGeometry(0.62, 48), mkGlass(L('#cfe4f0')));
  pool.rotation.x = -Math.PI / 2; pool.position.copy(C[0]).add(V(0, 0.14, 0)); scene.add(pool);
  const drops = Array.from({ length: 16 }, (_, i) => {

    const ta = TWOS ? Math.floor(tr * 12) / 12 / SLOW : t;            // object + card time, optionally held "on twos" (12 poses/s)
    const heat = 0.12 + 0.88 * eio(seg(t, 2, 27.5));
    const flash = Math.exp(-Math.pow((t - 27.95) / 0.16, 2));
    domeMat.uniforms.uHeat.value = heat; domeMat.uniforms.uFlash.value = flash;
    glassAll.forEach(m => { m.uniforms.uHeat.value = heat; });
    scene.fog.density = lerp(0.012, 0.0035, eio(seg(t, 29.2, 31.0)));

    updateFlour(ta, tr); updateKnead(ta); updateProof(ta); updateStretch(ta); updateTop(ta); updateOven(ta, tr); updateHero(ta);
    updateParticles(ta, tr, heat); updateCards(ta, tr); updateCaptions(tr);

    const hu = headU(t); tubeMat.uniforms.uP.value = hu;
    head.position.copy(curve.getPointAt(clamp(hu, 0, 1))); headLight.position.copy(head.position);
    head.visible = hu > 0.001 && hu < 0.999;

    const cam = camAt(t, tr);
    camera.position.copy(cam.p); camera.up.set(0, 1, 0); camera.lookAt(cam.look); camera.rotateZ(cam.roll);
    camera.fov = cam.fov; camera.updateProjectionMatrix();
    dome.position.copy(camera.position);
    grade.uniforms.uT.value = tr;

    flashEl.style.opacity = flash.toFixed(3);
    scrimEl.style.opacity = (0.75 * eio(seg(t, 29.9, 30.8))).toFixed(3);
    const tIn = [seg(t, 30.1, 30.7), seg(t, 30.3, 31.0), seg(t, 30.8, 31.4)].map(eout);
    titleEl.style.opacity = tIn[0] > 0 ? '1' : '0';
    titleParts.forEach((el, i) => { el.style.opacity = tIn[i].toFixed(3); el.style.transform = `translateY(${((1 - tIn[i]) * 2).toFixed(2)}cqw)`; });

    composer.render();
    if (cam.shot !== lastShot) { lastShot = cam.shot; onShot && onShot(cam.shot); }
  }
  let onShot = null;

  // ================= sizing =================
  const deck = document.querySelector('.deck');
  function layout() {
    let w, h;
    if (CAPTURE) { w = 1920; h = 1080; }
    else {
      const cs = getComputedStyle(document.body);
      const aw = document.body.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const ah = window.innerHeight - deck.offsetHeight - 12 - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      w = Math.max(160, Math.min(aw, ah * 16 / 9)); h = w * 9 / 16;
    }
    stage.style.width = w + 'px'; stage.style.height = h + 'px';
    const pr = CAPTURE ? 1 : Math.min(window.devicePixelRatio || 1, 1.5);
    renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
    composer.setPixelRatio(pr); composer.setSize(w, h);
    grade.uniforms.uRes.value.set(w * pr, h * pr);
  }

  // ================= transport =================
  window.DURATION = DURATION; window.FPS = FPS;
  window.render = render;
  const fontLoads = ['800 100px Archivo', '700 40px Archivo', '600 40px Archivo', '500 40px Archivo', '500 30px "JetBrains Mono"'].map(f => document.fonts.load(f).catch(() => {}));
  window.ready = Promise.all(fontLoads).then(() => { fontsReady = true; });
  window.addEventListener('resize', layout); layout();

  if (CAPTURE) { window.ready.then(() => render(0)); return; }

  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !reduce, t = reduce ? 22.6 * SLOW : 0, last = performance.now();
  const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), chipsEl = document.getElementById('chips');
  scrub.max = DURATION;
  const chips = SHOTS.map((s, i) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = s.name;
    b.addEventListener('click', () => { setPlaying(false); t = (s.t0 + (s.t1 - s.t0) * 0.62) * SLOW; }); chipsEl.appendChild(b); return b; });
  const twosBtn = document.getElementById('twos');
  const syncTwos = () => { twosBtn.textContent = `On twos: ${TWOS ? 'on' : 'off'}`; twosBtn.setAttribute('aria-pressed', String(TWOS)); };
  twosBtn.addEventListener('click', () => { TWOS = !TWOS; syncTwos(); }); syncTwos();
  onShot = i => chips.forEach((b, k) => b.setAttribute('aria-current', k === i ? 'true' : 'false'));
  function setPlaying(v) { playing = v; playBtn.textContent = v ? 'Pause' : 'Play'; }
  setPlaying(playing);
  playBtn.addEventListener('click', () => setPlaying(!playing));
  scrub.addEventListener('input', () => { setPlaying(false); t = +scrub.value; });
  window.addEventListener('keydown', e => {
    if (e.target === scrub) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    if (e.code === 'ArrowRight') { setPlaying(false); t = Math.min(DURATION, t + 1 / FPS); }
    if (e.code === 'ArrowLeft') { setPlaying(false); t = Math.max(0, t - 1 / FPS); }
  });
  window.ready.then(() => layout());
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (playing) { t += dt; if (t >= DURATION) t = 0; }
    render(t);
    scrub.value = t; timeEl.innerHTML = `<b>${t.toFixed(2).padStart(6, '0')}</b> / ${DURATION.toFixed(2)} s`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
